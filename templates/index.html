<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Audio to Text</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    button { padding: 10px 18px; font-size: 16px; border-radius: 6px; border: 1px solid #888; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #record.active { background: #d33; color: #fff; border-color: #d33; }
    #wave { display: block; width: 100%; height: 90px; margin: 16px 0; background: #111; border-radius: 8px; }
    #status { color: #555; min-height: 1.4em; }
    #output { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 6px; min-height: 80px; }
  </style>
</head>
<body>
  <h1>Live Audio to Text</h1>
  <button id="record">Start recording</button>
  <canvas id="wave" data-testid="waveform"></canvas>
  <p id="status" data-state="idle">Idle</p>
  <div id="output" data-testid="transcript"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    let recorder, chunks = [];

    function setStatus(state, text) {
      $("status").dataset.state = state;
      $("status").textContent = text;
    }

    const canvas = $("wave"), ctx2d = canvas.getContext("2d");
    const BAR = 3, GAP = 2;
    let levels = [], raf, audioCtx;

    function drawWave(analyser) {
      const buf = new Uint8Array(analyser.fftSize);
      const w = (canvas.width = canvas.clientWidth * devicePixelRatio);
      const h = (canvas.height = canvas.clientHeight * devicePixelRatio);
      const step = (BAR + GAP) * devicePixelRatio, max = Math.floor(w / step);
      analyser.getByteTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + ((v - 128) / 128) ** 2, 0) / buf.length);
      levels.push(Math.min(1, rms * 4));
      if (levels.length > max) levels.shift();
      ctx2d.clearRect(0, 0, w, h);
      ctx2d.fillStyle = "#fff";
      levels.forEach((l, i) => {
        const bh = Math.max(2 * devicePixelRatio, l * h);
        ctx2d.fillRect(w - (levels.length - i) * step, (h - bh) / 2, BAR * devicePixelRatio, bh);
      });
      raf = requestAnimationFrame(() => drawWave(analyser));
    }

    async function start() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new AudioContext();
      const analyser = audioCtx.createAnalyser();
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      levels = [];
      drawWave(analyser);
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = () => {
        cancelAnimationFrame(raf);
        audioCtx.close();
        stream.getTracks().forEach((t) => t.stop());
        send();
      };
      recorder.start();
      $("record").textContent = "Stop recording";
      $("record").classList.add("active");
      setStatus("recording", "Recording...");
    }

    async function send() {
      const body = new FormData();
      body.append("audio", new Blob(chunks, { type: recorder.mimeType }), "recording.webm");
      setStatus("transcribing", "Transcribing...");
      $("record").disabled = true;
      try {
        const res = await fetch("/transcribe", { method: "POST", body });
        const data = await res.json();
        $("output").textContent = data.text ?? data.error;
        setStatus(res.ok ? "done" : "error", res.ok ? "Done" : "Error");
      } catch (err) {
        setStatus("error", "Error: " + err.message);
      }
      $("record").disabled = false;
    }

    $("record").onclick = () => {
      if (recorder && recorder.state === "recording") {
        recorder.stop();
        $("record").textContent = "Start recording";
        $("record").classList.remove("active");
      } else {
        start().catch((err) => setStatus("error", "Mic error: " + err.message));
      }
    };
  </script>
</body>
</html>
